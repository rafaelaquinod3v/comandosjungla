<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="Content-Security-Policy" content="
default-src 'self';
script-src 'self';
style-src 'self';
font-src 'self';
img-src 'self' data: blob:;
connect-src 'self';
media-src 'self' blob:;
frame-src 'none';
base-uri 'self';
form-action 'self';
upgrade-insecure-requests;">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light dark">
    <link rel="manifest" href="/manifest.json">
    <!-- Stylesheets: exact load order — do not change -->
    <link rel="stylesheet" href="/css/tokens.css">
    <link rel="stylesheet" href="/css/layout.css">
    <link rel="stylesheet" href="/css/components.css">
    <link rel="stylesheet" href="/css/a11y.css">
    <title>Comandos Jungla - PWA Skeleton</title>
</head>
<body>
    <a href="#main" class="skip-link">Skip to content</a>
    <app-shell>
        <header role="banner">
            <nav>
                <app-nav aria-label="Primary navigation"></app-nav>
            </nav>
        </header>
        <main id="main" tabindex="-1">
            <section aria-labelledby="welcome-heading">
                <h1 id="welcome-heading">Welcome to jcore</h1>
                <p>Establishing the SOIL layer for the Comandos Jungla framework.</p>
                <article>
                    <h2>Core Rules</h2>
                    <p>Weight, Privacy, Native-First, Accessibility.</p>
                </article>
            </section>
            <aside>
                <h3>Status</h3>
                <p>All systems operational.</p>
            </aside>
        </main>
        <footer role="contentinfo">
            <p>&copy; 2026 Kubo Labs. All rights reserved.</p>
        </footer>
    </app-shell>
    <app-toast></app-toast>
    <div id="sr-announcer"
         role="status"
         aria-live="polite"
         aria-atomic="true"
         class="sr-only"></div>
    <script src="/js/app.js" type="module"></script>
</body>
</html>
